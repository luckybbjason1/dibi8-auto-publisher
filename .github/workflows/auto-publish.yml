name: Auto Publish dibi8 Articles

on:
  schedule:
    # Staggered triggers at non-round minutes to avoid bot-like patterns.
    # Combined with 0-50 min startup jitter, actual post times are fully random.
    # === Asia business hours (UTC+8 09:00–17:00 = UTC 01:00–09:00) ===
    - cron: '17 1-9 * * *'
    # === US business hours (UTC-5 09:00–17:00 = UTC 14:00–22:00) ===
    - cron: '43 14-22 * * *'
  workflow_dispatch:   # manual trigger

# Prevent overlapping runs (previous run must finish before next starts)
concurrency:
  group: auto-publish
  cancel-in-progress: false

permissions:
  contents: write     # push updated published.json and rate_limits.json back

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # safety net: up to 50 min jitter + publish time

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run publisher
        env:
          # --- Anti-Ban Settings ---
          STARTUP_JITTER_MAX: '3000'          # 0-50 min random startup delay (fully random within the hour)
          INTER_PLATFORM_DELAY_MIN: '60'      # 1-5 min between platforms
          INTER_PLATFORM_DELAY_MAX: '300'
          RANDOM_SKIP_PROBABILITY: '0.15'     # 15% chance to skip (looks human)
          # --- Twitter/X (2026-02 起付费,默认 skip;主人确认花钱后设置 TWITTER_PAID_MODE_CONFIRMED=true) ---
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_PAID_MODE_CONFIRMED: ${{ secrets.TWITTER_PAID_MODE_CONFIRMED }}   # set "true" to enable
          # --- Facebook ---
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          # --- Reddit ---
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          REDDIT_SUBREDDITS: ${{ secrets.REDDIT_SUBREDDITS }}
          # --- Dev.to (V2 upgrade 2026-05-25) ---
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          # Hashnode 已移除 (2026 API 转 Pro plan)
        run: python run.py

      - name: Commit tracking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/published.json data/rate_limits.json
          git diff --cached --quiet || git commit -m "chore: update published articles and rate limits"
          git push
